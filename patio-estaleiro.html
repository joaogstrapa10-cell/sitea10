<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pátio Estaleiro · A10 Empreendimentos</title>
<meta name="description" content="Pátio Estaleiro Private Residences: coleção privada de oito residências contemporâneas a 90 metros da Praia do Estaleiro, em Balneário Camboriú.">
<link rel="stylesheet" href="lib/fontes.css">
<link rel="stylesheet" href="lib/leaflet/leaflet.css"/>
<style>
:root{--cream:#F5F2EA;--paper:#FBFAF5;--card:#FFFFFF;--navy:#0B1624;--navy-2:#1D2C4B;--gold:#B7965A;--gold-l:#E7D09B;--gold-d:#856733;--ink:#1D2C4B;--muted:#6E7683;--line:rgba(29,44,75,.12);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Poppins','Segoe UI',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
*:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:3px}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,44px)}
em{font-style:italic}
.k{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold-d)}
h2.t{font-family:var(--serif);font-weight:500;font-size:clamp(28px,4vw,46px);line-height:1.08;color:var(--navy);margin-top:14px}
h2.t em{color:var(--gold-d)}
p.lead{font-size:15.5px;line-height:1.75;color:var(--navy-2);max-width:66ch;margin-top:18px}
/* nav */
.nav{position:sticky;top:0;z-index:1200;background:rgba(251,250,245,.9);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:64px;gap:18px}
.logo-img{height:38px;width:auto}
@media(max-width:560px){.logo-img{height:30px}}
.nav-r{display:flex;align-items:center;gap:19px}
.nav-r a.link{font-size:12.5px;color:var(--navy-2);opacity:.78;white-space:nowrap}
.nav-r a.link:hover{opacity:1;color:var(--gold-d)}
.nav-wa{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;padding:9px 16px;border-radius:100px;font-size:12.5px;font-weight:500;white-space:nowrap}
.nav-wa svg{width:15px;height:15px;stroke:#fff;fill:none}
@media(max-width:1040px){.nav-r a.link{display:none}.nav-r a.link.volta{display:inline}}
/* hero */
.hero{position:relative;min-height:min(88vh,760px);display:flex;align-items:flex-end;background:var(--navy);overflow:hidden}
.hero-bg{position:absolute;inset:0}
.hero-bg img{width:100%;height:100%;object-fit:cover;opacity:.66}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,22,36,.55) 0%,rgba(11,22,36,.18) 26%,rgba(11,22,36,.62) 55%,rgba(11,22,36,.95) 100%)}
.hero-in{position:relative;z-index:2;width:100%;padding:0 0 clamp(44px,7vw,84px)}
.hero .eye{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold-l);margin-bottom:22px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,6.4vw,78px);line-height:1.04;color:#fff;letter-spacing:.01em}
.hero h1 em{display:block;color:var(--gold-l);font-weight:500}
.hero p{font-size:15.5px;line-height:1.75;color:rgba(255,255,255,.8);max-width:52ch;margin-top:24px}
.hero .acts{margin-top:32px;display:flex;gap:12px;flex-wrap:wrap}
.btn-gold{display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:#0B1624;padding:15px 30px;border-radius:100px;font-size:13.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;transition:background .2s}
.btn-gold:hover{background:var(--gold-l)}
.btn-line{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.4);color:#fff;padding:15px 30px;border-radius:100px;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;transition:.2s}
.btn-line:hover{border-color:var(--gold-l);color:var(--gold-l)}
/* marca de secao */
section.blk{padding:clamp(56px,8vw,112px) 0}
section.navy{background:var(--navy);color:#cfd6e0}
section.navy .k{color:var(--gold)}
section.navy h2.t{color:#fff}
section.navy h2.t em{color:var(--gold-l)}
section.navy p.lead{color:rgba(255,255,255,.76)}
section.cream{background:var(--cream)}
/* valores */
.valores{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(16px,2vw,26px);margin-top:clamp(36px,5vw,58px)}
@media(max-width:980px){.valores{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.valores{grid-template-columns:1fr}}
.valor{border-top:1px solid rgba(183,150,90,.45);padding-top:22px}
.valor .n{font-family:var(--serif);font-size:15px;color:var(--gold-d);letter-spacing:.12em}
.valor h3{font-family:var(--serif);font-weight:600;font-size:25px;color:var(--navy);margin:8px 0 10px}
.valor p{font-size:14px;line-height:1.7;color:var(--muted)}
section.navy .valor{border-top-color:rgba(183,150,90,.5)}
section.navy .valor .n{color:var(--gold)}
section.navy .valor h3{color:#fff}
section.navy .valor p{color:rgba(255,255,255,.66)}
/* split foto + texto */
.split{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,4.5vw,66px);align-items:center}
.split.rev{grid-template-columns:.95fr 1.05fr}
@media(max-width:900px){.split,.split.rev{grid-template-columns:1fr;gap:32px}}
.split-img{position:relative;border-radius:4px;overflow:hidden;aspect-ratio:4/5;background:var(--navy)}
.split-img.wide{aspect-ratio:4/3}
.split-img img{width:100%;height:100%;object-fit:cover}
.split-img::after{content:"";position:absolute;inset:14px;border:1px solid rgba(231,208,155,.45);pointer-events:none}
/* stats */
.stats{display:flex;flex-wrap:wrap;gap:clamp(26px,5vw,62px);margin-top:clamp(30px,4vw,46px)}
.stat .v{font-family:var(--serif);font-weight:500;font-size:clamp(40px,5.6vw,66px);line-height:1;color:var(--gold-d)}
.stat .l{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:10px}
section.navy .stat .v{color:var(--gold-l)}
section.navy .stat .l{color:rgba(255,255,255,.6)}
/* bullets */
.bl{list-style:none;margin-top:30px;display:grid;gap:14px}
.bl li{position:relative;padding-left:26px;font-size:15px;color:var(--navy-2)}
.bl li::before{content:"";position:absolute;left:0;top:9px;width:8px;height:8px;border:1px solid var(--gold);transform:rotate(45deg)}
section.navy .bl li{color:rgba(255,255,255,.8)}
/* selos */
.selos{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2vw,22px);margin-top:clamp(32px,4vw,50px)}
@media(max-width:760px){.selos{grid-template-columns:1fr}}
.selo{border:1px solid rgba(183,150,90,.4);border-radius:4px;padding:26px 22px;text-align:center}
.selo b{display:block;font-family:var(--serif);font-weight:600;font-size:21px;color:var(--navy)}
.selo span{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:8px}
section.navy .selo b{color:#fff}
section.navy .selo span{color:rgba(255,255,255,.6)}
.cit{font-family:var(--serif);font-style:italic;font-size:clamp(22px,3.2vw,34px);line-height:1.45;color:var(--navy);text-align:center;max-width:26ch;margin:clamp(44px,6vw,76px) auto 0}
section.navy .cit{color:var(--gold-l)}
.cit::before,.cit::after{content:"“";color:var(--gold);font-size:1.1em;line-height:0}
.cit::after{content:"”"}
/* galeria */
.gal-grp+.gal-grp{margin-top:40px}
.gal-grp-t{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-d);margin-bottom:16px}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.gthumb{position:relative;border:0;padding:0;aspect-ratio:4/3;border-radius:3px;overflow:hidden;cursor:zoom-in;background:var(--navy)}
.gthumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.gthumb:hover img{transform:scale(1.06)}
.gthumb::after{content:"";position:absolute;inset:0;border:1px solid transparent;transition:border-color .2s}
.gthumb:hover::after{border-color:var(--gold-l)}
/* lightbox */
.lb{position:fixed;inset:0;z-index:1400;background:rgba(7,13,22,.96);display:none;align-items:center;justify-content:center}
.lb.open{display:flex}
.lb img{max-width:92vw;max-height:84vh;object-fit:contain}
.lb-x{position:absolute;top:18px;right:18px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:22px;cursor:pointer}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:24px;cursor:pointer}
.lb-prev{left:18px}.lb-next{right:18px}
.lb-x:hover,.lb-nav:hover{background:rgba(255,255,255,.24)}
.lb-cap{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:rgba(255,255,255,.8);font-size:12.5px}
@media(max-width:620px){.lb-nav{width:42px;height:42px}.lb-prev{left:8px}.lb-next{right:8px}}
/* mapa */
#patioMap{width:100%;height:clamp(300px,42vw,440px);border-radius:4px;border:1px solid var(--line);z-index:0;margin-top:clamp(30px,4vw,46px)}
.a10-pin{background:none;border:0;filter:drop-shadow(0 3px 5px rgba(11,22,36,.35))}
.mapmeta{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:16px}
.endereco{font-size:14.5px;color:var(--navy-2)}
.endereco b{display:block;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-d);margin-bottom:4px;font-weight:600}
.maps-link{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--navy);padding:10px 16px;border-radius:100px;font-size:13px}
.maps-link:hover{border-color:var(--gold)}
.maps-link svg{width:14px;height:14px;stroke:currentColor;fill:none}
/* contato */
.ct-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:clamp(32px,4vw,48px)}
.ct-card{border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:24px}
.ct-card h3{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.ct-card p,.ct-card a{font-size:14px;color:rgba(255,255,255,.8);line-height:1.7;word-break:break-word;display:block}
.ct-card a:hover{color:var(--gold-l)}
.ct-card .hora{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:13.5px;color:rgba(255,255,255,.8)}
.ct-card .hora:last-child{border-bottom:0}
.ct-card .hora span:last-child{color:rgba(255,255,255,.55)}
.ct-cta{margin-top:34px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
/* footer */
footer{background:#070D16;color:#8d99a8;padding:56px 0 34px}
.foot-top{display:flex;justify-content:space-between;gap:34px;flex-wrap:wrap;align-items:flex-start}
.foot-logo{height:46px}
.foot-assin{font-family:var(--serif);font-style:italic;font-size:19px;color:#d8dfe8;margin-top:18px;max-width:30ch}
.foot-res{font-size:13.5px;line-height:1.75;max-width:42ch;margin-top:14px}
.foot-nav{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:12.5px}
.foot-nav a:hover{color:var(--gold-l)}
.pilares{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:34px;padding-top:26px;border-top:1px solid rgba(255,255,255,.1);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.foot-note{margin-top:22px;font-size:11px;color:#4e5a6b}
</style>
</head>
<body>

<div class="nav"><div class="wrap nav-in">
  <a href="index.html" aria-label="A10 Empreendimentos"><img class="logo-img" src="lib/a10-logo.png" alt="A10 Empreendimentos"></a>
  <div class="nav-r" id="navR"></div>
</div></div>

<header class="hero">
  <div class="hero-bg"><img src="fotos/img/patio-estaleiro.jpg" alt="Pátio Estaleiro" fetchpriority="high"></div>
  <div class="hero-in"><div class="wrap">
    <div class="eye" id="hEye"></div>
    <h1 id="hTit"></h1>
    <p id="hSub"></p>
    <div class="acts">
      <a class="btn-gold" id="hCta" target="_blank" rel="noopener"></a>
      <a class="btn-line" href="#galeria">Ver as fotos</a>
    </div>
  </div></div>
</header>

<main id="main"></main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Foto ampliada">
  <button class="lb-x" onclick="lbClose()" aria-label="Fechar">&times;</button>
  <button class="lb-nav lb-prev" onclick="lbPrev()" aria-label="Foto anterior">&#8249;</button>
  <img id="lbImg" alt="">
  <button class="lb-nav lb-next" onclick="lbNext()" aria-label="Próxima foto">&#8250;</button>
  <div class="lb-cap" id="lbCap"></div>
</div>

<footer><div class="wrap">
  <div class="foot-top">
    <div>
      <img class="foot-logo" src="lib/a10-logo.png" alt="A10 Empreendimentos">
      <div class="foot-assin" id="fAssin"></div>
      <div class="foot-res" id="fRes"></div>
    </div>
    <div class="foot-nav" id="fNav"></div>
  </div>
  <div class="pilares" id="fPil"></div>
  <div class="foot-note">A10 Empreendimentos · Pátio Estaleiro Private Residences. Imagens meramente ilustrativas; metragens, valores e disponibilidade sujeitos a confirmação.</div>
</div></footer>

<script src="dados/empreendimentos.js"></script>
<script src="lib/leaflet/leaflet.js"></script>
<script>
const IMG=new Proxy({},{get:function(_,k){return 'fotos/img/'+String(k)+'.jpg';}});
const EMP=window.A10.empreendimentos.find(e=>e.slug==='patio-estaleiro');
const L10=window.A10.patio_landing;
const CONTATO=window.A10.contato;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function waLink(t){return 'https://wa.me/'+CONTATO.whatsapp+'?text='+encodeURIComponent(t||('Olá! Tenho interesse no '+EMP.nome+'. Poderia me enviar mais informações?'));}
function icon(t){const m={
  wa:'<path d="M8 1.5A6.5 6.5 0 001.7 11L1 15l4.1-.7A6.5 6.5 0 108 1.5z" stroke-width="1.2"/>',
  pin:'<path d="M8 14s5-4.2 5-8A5 5 0 003 6c0 3.8 5 8 5 8z"/><circle cx="8" cy="6" r="1.7"/>'
};return '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'+(m[t]||'')+'</svg>';}

/* ---- topo ---- */
document.getElementById('hEye').textContent=L10.eyebrow;
document.getElementById('hTit').innerHTML=esc(L10.titulo)+'<em>'+esc(L10.titulo_2)+'</em>';
document.getElementById('hSub').textContent=L10.subtitulo;
const hCta=document.getElementById('hCta');
hCta.textContent=L10.cta; hCta.href=waLink('Olá! Gostaria de agendar uma visita ao Pátio Estaleiro.');

document.getElementById('navR').innerHTML=
   L10.secoes.map(s=>'<a class="link" href="#'+esc(s.id)+'">'+esc(s.nav)+'</a>').join('')
  +'<a class="link" href="#contato">Contato</a>'
  +'<a class="link volta" href="index.html">Portfólio A10</a>'
  +'<a class="nav-wa" href="'+waLink('Olá! Gostaria de agendar uma visita ao Pátio Estaleiro.')+'" target="_blank" rel="noopener">'+icon('wa')+' Agendar visita</a>';

/* ---- fotos por grupo ---- */
const GRUPOS=EMP.grupos||[];
const TODAS=GRUPOS.length?GRUPOS.reduce((a,g)=>a.concat(g.fotos||[]),[]):(EMP.fotos||[]).slice(1);
const foto=i=>TODAS[Math.min(i,TODAS.length-1)];

/* ---- secoes ---- */
function secValores(s){
  return '<section class="blk cream" id="'+esc(s.id)+'"><div class="wrap">'
    +'<div class="k">'+esc(s.kicker)+'</div><h2 class="t">'+esc(s.titulo)+'</h2>'
    +'<p class="lead">'+esc(s.texto)+'</p>'
    +'<div class="valores">'+s.valores.map(v=>
        '<div class="valor"><div class="n">'+esc(v[0])+'</div><h3>'+esc(v[1])+'</h3><p>'+esc(v[2])+'</p></div>').join('')
    +'</div></div></section>';
}
function secResidencias(s){
  return '<section class="blk" id="'+esc(s.id)+'"><div class="wrap"><div class="split">'
    +'<div><div class="k">'+esc(s.kicker)+'</div><h2 class="t">'+esc(s.titulo)+'</h2>'
    +'<p class="lead">'+esc(s.texto)+'</p>'
    +'<div class="stats">'+s.stats.map(st=>'<div class="stat"><div class="v">'+esc(st[0])+'</div><div class="l">'+esc(st[1])+'</div></div>').join('')+'</div></div>'
    +'<div class="split-img"><img src="'+IMG[foto(0)]+'" alt="Residências do Pátio Estaleiro" loading="lazy"></div>'
    +'</div></div></section>';
}
function secNatureza(s){
  return '<section class="blk navy" id="'+esc(s.id)+'"><div class="wrap"><div class="split rev">'
    +'<div class="split-img wide"><img src="'+IMG[foto(1)]+'" alt="Jardim, deck e piscina privativa" loading="lazy"></div>'
    +'<div><div class="k">'+esc(s.kicker)+'</div><h2 class="t">'+esc(s.titulo)+'</h2>'
    +'<p class="lead">'+esc(s.texto)+'</p>'
    +'<ul class="bl">'+s.bullets.map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul></div>'
    +'</div></div></section>';
}
function secSantuario(s){
  return '<section class="blk cream" id="'+esc(s.id)+'"><div class="wrap">'
    +'<div style="max-width:70ch"><div class="k">'+esc(s.kicker)+'</div><h2 class="t">'+esc(s.titulo)+'</h2>'
    +'<p class="lead">'+esc(s.texto)+'</p></div>'
    +'<div class="selos">'+s.selos.map(x=>'<div class="selo"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>').join('')+'</div>'
    +'<blockquote class="cit">'+esc(s.citacao)+'</blockquote>'
    +'</div></section>';
}
function secGaleria(){
  let off=0,h='';
  if(GRUPOS.length){
    GRUPOS.forEach(g=>{
      const f=g.fotos||[];
      h+='<div class="gal-grp"><div class="gal-grp-t">'+esc(g.nome)+' · '+f.length+' fotos</div><div class="gal-grid">'
        +f.map((k,i)=>'<button class="gthumb" onclick="lbOpen('+(off+i)+')" aria-label="Ampliar foto '+(off+i+1)+'"><img src="'+IMG[k]+'" alt="'+esc(g.nome)+' '+(i+1)+'" loading="lazy"></button>').join('')
        +'</div></div>';
      off+=f.length;
    });
  }else{
    h='<div class="gal-grid">'+TODAS.map((k,i)=>'<button class="gthumb" onclick="lbOpen('+i+')" aria-label="Ampliar foto '+(i+1)+'"><img src="'+IMG[k]+'" alt="Foto '+(i+1)+'" loading="lazy"></button>').join('')+'</div>';
  }
  return '<section class="blk" id="galeria"><div class="wrap">'
    +'<div class="k">Galeria de fotos</div><h2 class="t">As casas por <em>dentro.</em></h2>'
    +'<p class="lead">'+TODAS.length+' fotos das duas residências disponíveis no condomínio.</p>'
    +'<div style="margin-top:clamp(30px,4vw,46px)">'+h+'</div></div></section>';
}
function secLocalizacao(s){
  return '<section class="blk cream" id="'+esc(s.id)+'"><div class="wrap">'
    +'<div style="max-width:68ch"><div class="k">'+esc(s.kicker)+'</div><h2 class="t">'+esc(s.titulo)+'</h2>'
    +'<p class="lead" style="font-family:var(--serif);font-size:21px;color:var(--gold-d);margin-top:10px">'+esc(s.subtitulo)+'</p>'
    +'<p class="lead">'+esc(s.texto)+'</p>'
    +'<div class="stats">'+s.stats.map(st=>'<div class="stat"><div class="v">'+esc(st[0])+'</div><div class="l">'+esc(st[1])+'</div></div>').join('')+'</div></div>'
    +'<div id="patioMap"></div>'
    +'<div class="mapmeta"><div class="endereco"><b>Endereço</b>'+esc(EMP.endereco)+'</div>'
    +'<a class="maps-link" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(EMP.endereco)+'" target="_blank" rel="noopener">'+icon('pin')+' Ver no Google Maps</a></div>'
    +'</div></section>';
}
function secContato(){

    +'<p class="lead" style="margin-inline:auto">'+esc(l.texto)+'</p>'
    +'<div class="ct-grid" style="text-align:left">'
      +'<div class="ct-card"><h3>Endereço</h3><p>'+esc(c.endereco)+'</p></div>'
      +'<div class="ct-card"><h3>Fale com a gente</h3>'
        +'<a href="'+waLink()+'" target="_blank" rel="noopener">WhatsApp '+esc(c.whatsapp_label)+'</a>'
        +'<a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a></div>'
      +'<div class="ct-card"><h3>Horário de atendimento</h3>'+horas+'</div>'
      +'<div class="ct-card"><h3>Redes sociais</h3>'
        +'<a href="'+esc(c.instagram)+'" target="_blank" rel="noopener">Instagram '+esc(c.instagram_label)+'</a>'
        +'<a href="'+esc(c.youtube)+'" target="_blank" rel="noopener">YouTube '+esc(c.youtube_label)+'</a></div>'
    +'</div>'
    +'<div class="ct-cta"><a class="btn-gold" href="'+waLink('Olá! Gostaria de agendar uma visita ao Pátio Estaleiro.')+'" target="_blank" rel="noopener">'+esc(L10.cta)+'</a></div>'
    +'</div></section>';
}

const RENDER={filosofia:secValores,residencias:secResidencias,natureza:secNatureza,santuario:secSantuario,localizacao:secLocalizacao};
let html='';
L10.secoes.forEach(s=>{
  html+=(RENDER[s.id]||(()=>''))(s);
  if(s.id==='santuario')html+=secGaleria();
});
html+=secContato();
document.getElementById('main').innerHTML=html;

/* ---- rodape ---- */
document.getElementById('fAssin').textContent=L10.rodape.assinatura;
document.getElementById('fRes').textContent=L10.rodape.resumo;
document.getElementById('fNav').innerHTML=L10.secoes.map(s=>'<a href="#'+esc(s.id)+'">'+esc(s.nav)+'</a>').join('')
  +'<a href="#galeria">Galeria de fotos</a><a href="#contato">Contato & Visita</a><a href="index.html">Portfólio A10</a>';
document.getElementById('fPil').innerHTML=L10.rodape.pilares.map(p=>'<span>'+esc(p)+'</span>').join('');

/* ---- lightbox ---- */
let lbIdx=0;
function lbOpen(i){lbIdx=i;document.getElementById('lb').classList.add('open');lbPaint();document.body.style.overflow='hidden';}
function lbClose(){document.getElementById('lb').classList.remove('open');document.body.style.overflow='';}
function lbPaint(){document.getElementById('lbImg').src=IMG[TODAS[lbIdx]];document.getElementById('lbCap').textContent=(lbIdx+1)+' de '+TODAS.length;}
function lbPrev(){lbIdx=(lbIdx-1+TODAS.length)%TODAS.length;lbPaint();}
function lbNext(){lbIdx=(lbIdx+1)%TODAS.length;lbPaint();}
document.getElementById('lb').addEventListener('click',ev=>{if(ev.target.id==='lb')lbClose();});
window.addEventListener('keydown',ev=>{
  if(!document.getElementById('lb').classList.contains('open'))return;
  if(ev.key==='Escape')lbClose();else if(ev.key==='ArrowLeft')lbPrev();else if(ev.key==='ArrowRight')lbNext();
});

/* ---- mapa ---- */
(function(){
  const el=document.getElementById('patioMap');
  if(!el||typeof L==='undefined')return;
  const map=L.map(el,{scrollWheelZoom:false}).setView([EMP.lat,EMP.lng],16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
  const pin=L.divIcon({className:'a10-pin',html:'<svg width="36" height="48" viewBox="0 0 36 48" xmlns="http://www.w3.org/2000/svg"><path d="M18 1C9.2 1 2 8.2 2 17c0 11.2 16 30 16 30s16-18.8 16-30C34 8.2 26.8 1 18 1z" fill="#C9A86A" stroke="#fff" stroke-width="2"/><circle cx="18" cy="17" r="6" fill="#0B1624"/></svg>',iconSize:[36,48],iconAnchor:[18,46]});
  L.marker([EMP.lat,EMP.lng],{icon:pin}).addTo(map).bindTooltip(EMP.nome,{direction:'top',offset:[0,-44]});
  setTimeout(()=>map.invalidateSize(),160);
})();
</script>
